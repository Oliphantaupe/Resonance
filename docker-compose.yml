x-spark-common: &spark-common
  image: bitnami/spark:3.5
  environment:
    - SPARK_MODE=worker
    - SPARK_MASTER_URL=spark://spark-master:7077
    - SPARK_WORKER_MEMORY=4G
    - SPARK_WORKER_CORES=2
    - SPARK_RPC_AUTHENTICATION_ENABLED=no
    - SPARK_RPC_ENCRYPTION_ENABLED=no
  volumes:
    - ./data:/data
    - ./src:/src
  depends_on:
    - spark-master

services:
  spark-master:
    image: bitnami/spark:3.5
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    ports:
      - "8080:8080"   # Spark UI
      - "7077:7077"   # Spark master
    volumes:
      - ./data:/data
      - ./src:/src

  spark-worker-1:
    <<: *spark-common
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.spark
    ports:
      - "8888:8888"   # Jupyter
      - "4040:4040"   # Spark application UI
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - DATA_ROOT=/data
      - JUPYTER_ENABLE_LAB=yes
      - PYTHONPATH=/src
    volumes:
      - ./data:/data
      - ./src:/src
      - ./notebooks:/home/jovyan/notebooks
      - ./reports:/home/jovyan/reports
    depends_on:
      - spark-master
    command: >
      start-notebook.sh
      --NotebookApp.token=''
      --NotebookApp.password=''

  dash:
    build:
      context: .
      dockerfile: Dockerfile.dash
    ports:
      - "8050:8050"
    environment:
      - DATA_ROOT=/data
      - PYTHONPATH=/app
    volumes:
      - ./data:/data
      - ./dashboard:/app/dashboard
    depends_on: []   # reads Gold Delta only — no Spark dependency at runtime

  # Kafka + Zookeeper — dormant until Part 4 (Streaming)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    profiles:
      - streaming   # only activated with: docker compose --profile streaming up

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    profiles:
      - streaming
