services:

  # ── Jupyter + Spark (local mode) ──────────────────────────────────────────
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.spark
    user: root
    ports:
      - "8888:8888"   # Jupyter Lab
      - "4040:4040"   # Spark Application UI (active while pipeline runs)
    environment:
      - SPARK_MASTER_URL=local[*]
      - DATA_ROOT=/data
      - SPARK_LOCAL_DIR=/tmp/spark-local
      - REPORTS_DIR=/home/jovyan/reports
      - JUPYTER_ENABLE_LAB=yes
      - PYTHONPATH=/src
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - SPARK_DRIVER_MEMORY=12g
      - SPARK_SHUFFLE_PARTITIONS=100
      - SPARK_OPTS=
      - SPARK_LOCAL_IP=127.0.0.1
    volumes:
      # Source / config — bind mounts (small, code only)
      - ./src:/src
      - ./notebooks:/home/jovyan/notebooks
      - ./reports:/home/jovyan/reports
      - ./conf:/home/jovyan/conf
      # All data on E: drive via bind mounts (avoids filling Docker's C: VHD)
      - ./data/raw:/data/raw:ro
      - ./data/bronze:/data/bronze
      - ./data/silver:/data/silver
      - ./data/gold:/data/gold
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - mlflow

  # ── MLflow tracking server ─────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts

  # ── Plotly Dash dashboard ──────────────────────────────────────────────────
  dash:
    build:
      context: .
      dockerfile: Dockerfile.dash
    ports:
      - "8050:8050"
    environment:
      - DATA_ROOT=/data
      - PYTHONPATH=/app
    volumes:
      - ./dashboard:/app/dashboard
      - ./data/gold:/data/gold:ro

  # ── Kafka + Zookeeper — dormant until Part 4 (Streaming) ──────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    profiles:
      - streaming

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - "KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181"
      - "KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      - "KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    profiles:
      - streaming

